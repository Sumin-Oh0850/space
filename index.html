<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIBE · 로고 모션</title>
<style>
  html,body{margin:0;height:100%;background:#03040c;overflow:hidden;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:#cfe6ff}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:9vh;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
  #sub{font-size:14px;letter-spacing:.35em;color:#8fb4e8;opacity:0;transition:opacity 1.4s;text-shadow:0 0 12px #3a7bff}
  #go{pointer-events:auto;text-decoration:none;color:#fff;font-size:16px;letter-spacing:.12em;padding:14px 34px;border-radius:40px;
      background:linear-gradient(90deg,#2b7bff,#b23cff);box-shadow:0 0 28px rgba(80,120,255,.55);opacity:0;transform:translateY(14px);
      transition:opacity 1s,transform 1s,box-shadow .25s,filter .25s}
  #go.show{opacity:1;transform:none}
  #go:hover{box-shadow:0 0 46px rgba(150,110,255,.9);filter:brightness(1.15)}
  #replay{pointer-events:auto;background:none;border:0;color:#6f8fc0;font-size:12px;cursor:pointer;opacity:0;transition:opacity 1s}
  #replay.show{opacity:.8}
  #replay:hover{color:#fff}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:15px}
</style>
</head>
<body>
<div id="ui">
  <div id="sub">THREE.JS · LOGO MOTION</div>
  <a id="go" href="space.html">🚀 우주 탐사 실행 (space.html)</a>
  <button id="replay">↻ 다시 재생</button>
</div>
<div id="err">three.js를 불러오지 못했습니다. 인터넷 연결을 확인하세요.<br><br><a id="go2" href="space.html" style="color:#7fd4ff">space.html 바로 열기</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if (typeof THREE === "undefined") { document.getElementById("err").style.display = "flex"; throw new Error("no three"); }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03040c, 0.012);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 46);

// ---------------------------------------------------------------- 로고 형태: 글자 픽셀 샘플링
const LOGO = "VIBE";
function sampleLogo() {
  const c = document.createElement("canvas"); c.width = 900; c.height = 260;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 220px 'Segoe UI','Arial Black',sans-serif";
  g.fillText(LOGO, 450, 140);
  const d = g.getImageData(0, 0, 900, 260).data, pts = [];
  for (let y = 0; y < 260; y += 3) for (let x = 0; x < 900; x += 3)
    if (d[(y * 900 + x) * 4 + 3] > 128) pts.push([(x - 450) / 22, -(y - 130) / 22]);
  return pts;
}
const shape = sampleLogo(), N = shape.length;
const fieldPts = 1800, TOTAL = N + fieldPts;

const pos = new Float32Array(TOTAL * 3), col = new Float32Array(TOTAL * 3);
const tgt = new Float32Array(TOTAL * 3), src = new Float32Array(TOTAL * 3), delay = new Float32Array(TOTAL);
const cA = new THREE.Color(0x35d0ff), cB = new THREE.Color(0xc04bff), tc = new THREE.Color();
for (let i = 0; i < TOTAL; i++) {
  if (i < N) {
    const [x, y] = shape[i];
    tgt.set([x, y, (Math.random() - 0.5) * 1.6], i * 3);
    tc.copy(cA).lerp(cB, (x + 20) / 40 + (Math.random() - 0.5) * 0.15);
    col.set([tc.r, tc.g, tc.b], i * 3);
    delay[i] = (x + 20) / 40 * 0.9 + Math.random() * 0.25;
  } else {                                   // 배경 먼지
    const r = 20 + Math.random() * 60, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    tgt.set([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a) * 0.6, r * Math.cos(b) - 10], i * 3);
    col.set([0.25, 0.35, 0.6], i * 3);
    delay[i] = 0;
  }
}
function scatter() {
  for (let i = 0; i < TOTAL; i++) {
    const r = 30 + Math.random() * 50, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    src[i * 3] = r * Math.sin(b) * Math.cos(a); src[i * 3 + 1] = r * Math.sin(b) * Math.sin(a); src[i * 3 + 2] = r * Math.cos(b);
  }
}
scatter(); pos.set(src);

const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "#fff"); gr.addColorStop(0.3, "rgba(255,255,255,.6)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
const points = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.42, map: dot, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(points);

// ---------------------------------------------------------------- 장식: 회전 링 + 중심 발광
const rings = new THREE.Group(); scene.add(rings);
[[16, 0.05, 0x35d0ff, 1.2], [20, 0.04, 0xc04bff, 0.8], [25, 0.03, 0x6a8bff, 0.5]].forEach(([r, t, c, sp], i) => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, t, 8, 200), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
  m.userData = { sp, i }; m.rotation.set(1.1 + i * 0.35, i * 0.6, i); rings.add(m);
});
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: 0x5a7bff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false }));
glow.scale.set(70, 26, 1); scene.add(glow);
const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false }));
scene.add(flash);

// ---------------------------------------------------------------- 타임라인
const T_BUILD = 3.2, T_HOLD = 9, T_OUT = 1.4;       // 조립 / 유지 / 분해
let t0 = performance.now() / 1000, phase = "build", shown = false;
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);
const clamp01 = x => Math.min(1, Math.max(0, x));
const subEl = document.getElementById("sub"), goEl = document.getElementById("go"), rpEl = document.getElementById("replay");
function restart() { t0 = performance.now() / 1000; phase = "build"; scatter(); }
rpEl.onclick = restart;

let mx = 0, my = 0;
addEventListener("pointermove", e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 70 : 50; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
dispatchEvent(new Event("resize"));

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000, t = now - t0;
  const p = geo.attributes.position.array;
  let w = 0;                        // 0: 흩어짐, 1: 조립 완료
  if (phase === "build") {
    w = 1;
    if (t > T_BUILD + T_HOLD) { phase = "out"; t0 = now; }
  } else {
    w = 1;
  }
  const tb = phase === "build" ? t : 0, to = phase === "out" ? t : 0;
  const fl = Math.sin(now * 1.3);
  for (let i = 0; i < TOTAL; i++) {
    const k = i * 3;
    let f;
    if (i >= N) { f = 1; }
    else if (phase === "build") f = ease((tb - delay[i] * 1.4) / (T_BUILD - 1.4));
    else f = 1 - ease((to - (1 - delay[i]) * 0.3) / (T_OUT - 0.3));
    // 조립 중 소용돌이 곡선: 선형 보간 + 수직 오프셋
    const sw = (1 - f) * Math.sin(f * 3.14159) * 6;
    const nx = Math.sin(now * 0.9 + i * 0.37) * 0.07, ny = Math.cos(now * 1.1 + i * 0.21) * 0.07;
    const base = i < N ? (1 - f) : 0;
    p[k]     = i < N ? src[k] + (tgt[k] - src[k]) * f + sw + nx * f : tgt[k] + Math.sin(now * 0.2 + i) * 0.5;
    p[k + 1] = i < N ? src[k + 1] + (tgt[k + 1] - src[k + 1]) * f + sw * 0.5 + ny * f + (f > 0.99 ? Math.sin(now * 2 + tgt[k] * 0.35) * 0.18 : 0) : tgt[k + 1] + Math.cos(now * 0.25 + i) * 0.5;
    p[k + 2] = i < N ? src[k + 2] + (tgt[k + 2] - src[k + 2]) * f : tgt[k + 2];
  }
  geo.attributes.position.needsUpdate = true;
  if (phase === "out" && t > T_OUT) { t0 = now; phase = "build"; scatter(); }

  // 링 / 발광: 조립이 끝나갈 때 등장
  const reveal = phase === "build" ? clamp01((t - T_BUILD * 0.7) / 1.4) : clamp01(1 - t / T_OUT);
  rings.children.forEach(m => { m.material.opacity = 0.55 * reveal; m.rotation.z += 0.004 * m.userData.sp; m.rotation.x += 0.0015 * m.userData.sp; m.scale.setScalar(0.85 + 0.15 * ease(reveal)); });
  glow.material.opacity = 0.22 * reveal + 0.05 * Math.sin(now * 2) * reveal;
  const fv = phase === "build" ? Math.exp(-Math.pow((t - T_BUILD) * 2.2, 2)) : 0;
  flash.material.opacity = fv * 0.9; flash.scale.setScalar(20 + fv * 60);

  points.rotation.y = mx * 0.18; points.rotation.x = my * 0.1;
  rings.rotation.y = mx * 0.25; rings.rotation.x = my * 0.15;
  camera.position.x += (mx * 4 - camera.position.x) * 0.04;
  camera.position.y += (-my * 2.5 - camera.position.y) * 0.04;
  camera.position.z = 46 - 6 * ease(t / 6) * (phase === "build" ? 1 : 0) + (phase === "build" ? 0 : -6);
  camera.lookAt(0, 0, 0);

  if (phase === "build" && t > T_BUILD && !shown) { shown = true; subEl.style.opacity = 1; goEl.classList.add("show"); rpEl.classList.add("show"); }
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
